name: Deploy World Map Generator OS to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'world-map.html'
      - 'galaxy.html'
      - 'Assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site/Assets
          cp index.html _site/index.html
          cp world-map.html _site/world-map.html
          cp galaxy.html _site/galaxy.html
          cp Assets/world-land.geojson _site/Assets/world-land.geojson
          cp Assets/world-countries.geojson _site/Assets/world-countries.geojson
          test -s _site/index.html
          test -s _site/galaxy.html
          test -s _site/Assets/world-land.geojson
          test -s _site/Assets/world-countries.geojson

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
