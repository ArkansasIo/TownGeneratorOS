name: Build and deploy TownGeneratorOS to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.6'

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 7.3.0 --quiet
          haxelib install openfl 8.9.0 --quiet
          haxelib install msignal 1.2.5 --quiet
          haxelib run lime setup

      - name: Build HTML5 release
        run: haxelib run lime build html5 -release

      - name: Verify generated site
        run: test -f Export/html5/bin/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Export/html5/bin

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
